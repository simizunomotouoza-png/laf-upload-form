<!DOCTYPE html>
<html lang="ja">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>忘れ物受付ページ</title>
  <style>
    body {
      font-family: "Noto Sans JP", sans-serif;
      margin: 0;
      padding: 0;
      height: 100vh;
      background: #ffffff;
      color: #222;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
    }

    header {
      width: 100%;
      background: #000;
      color: #fff;
      text-align: center;
      padding: 15px 0;
      font-size: 1.4rem;
      letter-spacing: 0.1rem;
      position: fixed;
      top: 0;
      left: 0;
    }

    main {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 100px 20px 60px;
      width: 100%;
      max-width: 600px;
    }

    h2 {
      font-size: 1.3rem;
      margin-bottom: 1rem;
      margin-top: 0;
    }

    p {
      font-size: 0.95rem;
      color: #555;
      margin-bottom: 2rem;
      line-height: 1.6;
    }

    button {
      display: inline-block;
      width: 80%;
      max-width: 320px;
      background-color: #000;
      color: white;
      border: none;
      border-radius: 40px;
      padding: 14px 0;
      margin: 10px 0;
      font-size: 1rem;
      font-weight: bold;
      cursor: pointer;
      transition: 0.2s;
    }

    button:hover {
      background-color: #333;
      transform: scale(1.02);
    }

    footer {
      font-size: 0.8rem;
      background: #000;
      color: #fff;
      padding: 15px;
      text-align: center;
      border-top: 1px solid #eee;
      width: 100%;
    }
  </style>
</head>

<body>
  <header>📦 忘れ物受付ページ</header>

  <main>
    <h2>忘れ物情報の入力</h2>
    <p>忘れ物を発見したら、下のボタンを押してフォームに<br>場所・品物・発見者を入力してください。</p>
    <button onclick="openForms()">📝 忘れ物入力フォームを開く</button>
  </main>

  <footer>※このフォームはナインアワーズスタッフ専用 作成者:樋口</footer>

  <script>
    function openForms() {
      const url = "https://forms.office.com/Pages/ResponsePage.aspx?id=3auM_QxryUCXIgDmaJSEHpM4CRfGSp1AmVbuan8Rgf9UNzc0M1FJV0lMQkIzSVlDWVVOVU9EWkNJRy4u";
      window.open(url, "_blank");
    }
  </script>
</body>

</html>
