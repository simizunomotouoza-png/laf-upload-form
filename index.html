<!DOCTYPE html>
<html lang="ja">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>忘れ物受付ページ</title>
  <style>
    /* ===== 全体デザイン ===== */
    body {
      font-family: "Noto Sans JP", sans-serif;
      margin: 0;
      padding: 0;
      background: #ffffff;
      color: #222;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
    }

    /* ===== ヘッダー ===== */
    header {
      width: 100%;
      background: #000;
      color: #fff;
      text-align: center;
      padding: 15px 0;
      font-size: 1.4rem;
      letter-spacing: 0.1rem;
    }

    main {
      width: 90%;
      max-width: 600px;
      text-align: center;
      padding: 30px 0;
    }

    h2 {
      font-size: 1.2rem;
      margin-top: 2rem;
    }

    /* ===== ボタン共通スタイル ===== */
    button,
    .upload-btn {
      display: inline-block;
      width: 90%;
      max-width: 320px;
      background-color: #000;
      color: white;
      border: none;
      border-radius: 40px;
      padding: 14px 0;
      margin: 10px 0;
      font-size: 1rem;
      font-weight: bold;
      text-align: center;
      cursor: pointer;
      transition: 0.2s;
    }

    button:hover,
    .upload-btn:hover {
      background-color: #333;
      transform: scale(1.02);
    }

    /* ===== ファイル選択非表示 ===== */
    input[type="file"] {
      display: none;
    }

    /* ===== コピー完了時の変化 ===== */
    #copyCode:active {
      background-color: #444;
    }

    p {
      font-size: 0.9rem;
      color: #666;
      margin: 8px 0;
    }

    /* ===== レスポンシブ対応 ===== */
    @media (min-width: 768px) {
      header {
        font-size: 1.8rem;
        padding: 20px 0;
      }

      h2 {
        font-size: 1.4rem;
      }

      button,
      .upload-btn {
        font-size: 1.1rem;
      }
    }
  </style>
</head>

<body>
  <header>忘れ物受付ページ</header>

  <main>
    <!-- ✅ 受付コードは裏で生成 -->
    <p id="code" style="display:none;"></p>

    <!-- 🔢 1. 受付コードコピー -->
    <h2>1. 受付コードをコピー</h2>
    <button id="copyCode" onclick="copyCode()">📋 受付コードをコピー</button>

    <!-- 🧾 2. 忘れ物入力フォーム -->
    <h2>2. 忘れ物情報の入力</h2>
    <button onclick="openForms()">📝 忘れ物入力フォームを開く</button>

    <!-- 📸 3. 写真アップロード -->
    <h2>3. 忘れ物写真のアップロード</h2>
    <form id="uploadForm" enctype="multipart/form-data">
      <label class="upload-btn">
        📷 写真をアップロードする
        <input type="file" id="photo" accept="image/*" capture="environment" required />
      </label>
    </form>
    <p id="result"></p>

    <p>このページから、忘れ物の「情報入力」と「写真アップロード」を行ってください。</p>
  </main>

  <script>
    let savedCode = "";

    // ===== 受付コード自動生成 =====
    const now = new Date();
    const code =
      now.getFullYear().toString() +
      ("0" + (now.getMonth() + 1)).slice(-2) +
      ("0" + now.getDate()).slice(-2) +
      ("0" + now.getHours()).slice(-2) +
      ("0" + now.getMinutes()).slice(-2) +
      ("0" + now.getSeconds()).slice(-2);
    document.getElementById("code").textContent = code;

    // ===== コピー処理 =====
    function copyCode() {
      navigator.clipboard.writeText(code).then(() => {
        savedCode = code;
        console.log("受付コードを保存しました:", savedCode);
        const btn = document.getElementById("copyCode");
        btn.textContent = "✅ コピーしました";
        btn.style.backgroundColor = "#2b7a2b";
        setTimeout(() => {
          btn.textContent = "📋 受付コードをコピー";
          btn.style.backgroundColor = "#000";
        }, 2000);
      });
    }

    // ===== Formsを開く =====
    function openForms() {
      const url = "https://forms.office.com/Pages/ResponsePage.aspx?id=3auM_QxryUCXIgDmaJSEHpM4CRfGSp1AmVbuan8Rgf9UNzc0M1FJV0lMQkIzSVlDWVVOVU9EWkNJRy4u";
      window.open(url, "_blank");
    }


    // ===== 写真アップロード処理 =====
    document.getElementById("photo").addEventListener("change", async (e) => {
      const file = e.target.files[0];
      if (!file) return alert("ファイルを選択してください。");

      if (!savedCode) {
        alert("⚠️ 先に「受付コードをコピー」を押してください。");
        return;
      }

      // ✅ OneDrive共有フォルダのアップロードリンク（編集可能）
      const uploadUrl = "https://ninehourscojp.sharepoint.com/:f:/g/EkoFib0wwdtJihZy0IGjHqoBnf8x_WabSQCQhTeE1EOdlQ?e=dMzE8K";

      const renamedFile = new File([file], `${savedCode}.jpg`, { type: file.type });
      document.getElementById("result").innerText = "📤 アップロード中...";

      try {
        const formData = new FormData();
        formData.append("file", renamedFile);

        const res = await fetch(uploadUrl, {
          method: "POST",
          body: formData,
        });

        if (res.ok) {
          document.getElementById("result").innerText = "✅ アップロード完了！";
        } else {
          document.getElementById("result").innerText = "⚠️ アップロード失敗";
          console.error(await res.text());
        }
      } catch (err) {
        document.getElementById("result").innerText = "❌ エラー: " + err.message;
      }
    });
  </script>


</body>

</html>
