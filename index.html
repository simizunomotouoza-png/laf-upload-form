<!DOCTYPE html>
<html lang="ja">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>忘れ物受付ページ</title>
  <style>
    /* ===== 全体デザイン ===== */
    body {
      font-family: "Noto Sans JP", sans-serif;
      margin: 0;
      padding: 0;
      background: #ffffff;
      color: #222;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
    }

    /* ===== ヘッダー ===== */
    header {
      width: 100%;
      background: #000;
      color: #fff;
      text-align: center;
      padding: 15px 0;
      font-size: 1.4rem;
      letter-spacing: 0.1rem;
    }

    main {
      width: 90%;
      max-width: 600px;
      text-align: center;
      padding: 50px 0;
    }

    h2 {
      font-size: 1.2rem;
      margin-top: 2rem;
    }

    /* ===== ボタン共通スタイル ===== */
    button {
      display: inline-block;
      width: 90%;
      max-width: 320px;
      background-color: #000;
      color: white;
      border: none;
      border-radius: 40px;
      padding: 14px 0;
      margin: 20px 0;
      font-size: 1rem;
      font-weight: bold;
      text-align: center;
      cursor: pointer;
      transition: 0.2s;
    }

    button:hover {
      background-color: #333;
      transform: scale(1.02);
    }

    /* ===== レスポンシブ対応 ===== */
    @media (min-width: 768px) {
      header {
        font-size: 1.8rem;
        padding: 20px 0;
      }

      h2 {
        font-size: 1.4rem;
      }

      button {
        font-size: 1.1rem;
      }
    }
  </style>
</head>

<body>
  <header>忘れ物受付ページ</header>

  <main>
    <!-- 🧾 忘れ物入力フォーム -->
    <h2>1. 忘れ物情報の入力</h2>
    <button onclick="openForms()">📝 忘れ物入力フォームを開く</button>
  </main>

  <script>
    // ===== Formsを開く =====
    function openForms() {
      const url = "https://forms.office.com/Pages/ResponsePage.aspx?id=3auM_QxryUCXIgDmaJSEHpM4CRfGSp1AmVbuan8Rgf9UNzc0M1FJV0lMQkIzSVlDWVVOVU9EWkNJRy4u";
      window.open(url, "_blank");
    }
  </script>
</body>

</html>
